; MOCHI firmware - ESP32-C3 (modulo ESP32-C3-MINI-1) + pantalla redonda GC9A01
; Compilar:  pio run          Subir:  pio run -t upload          Monitor:  pio device monitor
[platformio]
default_envs = mochi

[env:mochi]
platform = espressif32@6.5.0          ; Arduino-ESP32 2.0.14 (API ledc/Preferences usada aqui)
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240 -DTFT_HEIGHT=240
  -DTFT_MOSI=7 -DTFT_SCLK=6 -DTFT_CS=10 -DTFT_DC=5 -DTFT_RST=-1
  -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DUSE_HSPI_PORT=1
src_dir = src
; Prueba en PC (sin hardware):  make -C ../tests
